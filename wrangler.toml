name = "eleven"
main = "worker.js"
compatibility_date = "2025-01-01"

# Deploy = push to main (Cloudflare Workers Builds runs `wrangler deploy`).
# `npx wrangler deploy` also works. Deploys over the existing `eleven` worker.
#
# Secrets — set them in the Cloudflare dashboard: Workers & Pages → eleven →
# Settings → Variables and Secrets → Add, type **Secret**, then Deploy. Not
# under Settings → Build: those are build-time variables the running Worker
# never sees. The local wrangler token cannot write secrets.
#   ELEVENLABS_API_KEY  ElevenLabs Scribe v2 Medical (the default service)
#   APP_PASSPHRASE      the access code; with ELEVENLABS_API_KEY it turns on
#                       shared mode, and only shared mode can use the two below
#   SONIOX_API_KEY      Soniox, as the main service or the backup (optional)
#   OPENAI_API_KEY      OpenAI gpt-transcribe, likewise (optional)
# A service without its key is greyed out in Options. Secrets survive every
# deploy.
#
# Optional plain variable (type Text):
#   SONIOX_FALLBACK_AFTER_MS  overrides every service's wait before the
#                             backup is asked (see FALLBACK_AFTER_MS)

# Keep variables set in the dashboard when this file is deployed. Without it,
# every push to main deletes any plain-text (Text) variable set in the dashboard,
# e.g. SONIOX_FALLBACK_AFTER_MS or a key saved as Text instead of Secret.
keep_vars = true

[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_classes = ["SessionRoom"]

# Native Workers Rate Limiting — the GLOBAL layer over the per-isolate Map in
# worker.js (see the "Session-route protection" block there). Counters
# aggregate across every isolate in a Cloudflare location (eventually
# consistent), so they bound a distributed scan the per-isolate Map can't. The
# Worker feature-detects these (env.SESSION_RL / env.SESSION_FAIL_RL) and
# FAILS OPEN, so an account/plan without the binding still deploys and serves —
# it just falls back to the per-isolate backstop + the auth gate.
#   SESSION_RL      — all /api/session hits per IP  (limit matches LINK_RL_MAX_PER_IP)
#   SESSION_FAIL_RL — failed-auth attempts per IP    (limit matches LINK_RL_FAILS_PER_IP)
# period must be 10 or 60 (seconds). namespace_id is any per-account-unique int.
[[ratelimits]]
name = "SESSION_RL"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "SESSION_FAIL_RL"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
